<svg xmlns="http://www.w3.org/2000/svg" width="960" height="292" viewBox="0 0 960 292" role="img" aria-labelledby="title desc">
  <title id="title">Qiang Xu · Build something worth sharing</title>
  <desc id="desc">An original midnight-blue developer workspace with electric-blue accents and a project terminal.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2=".4"><stop stop-color="#0b1023"/><stop offset="1" stop-color="#152657"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#4385ff"/><stop offset="1" stop-color="#96c7ff"/></linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#689aff" opacity=".35"/></pattern>
  </defs>
  <rect width="960" height="292" rx="14" fill="url(#background)"/>
  <rect x="530" width="430" height="292" rx="14" fill="url(#dots)"/>
  <path d="M0 291H960" stroke="#4983ff" stroke-width="2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <rect x="40" y="30" width="27" height="22" rx="5" fill="#3676f5"/>
    <text x="45" y="45" fill="#fff" font-size="10" font-weight="700">QX</text>
    <text x="80" y="45" fill="#9eafd2" font-size="10" letter-spacing="2">LIGHTER00X / PROJECT SPACE</text>
    <text x="38" y="127" fill="#ffffff" font-size="64" font-weight="700" letter-spacing="-2.5">Qiang Xu<tspan fill="#6ba7ff">.</tspan></text>
    <text x="42" y="169" fill="#d9e5ff" font-size="20" font-weight="400">Build something worth sharing.</text>
    <text x="42" y="201" fill="#8fa6ce" font-size="13">Research, tools, and the ideas in between.</text>
    <rect x="42" y="238" width="35" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="90" y="243" fill="#91aedb" font-size="9" letter-spacing="2">CURIOUS MIND. HANDS-ON CODE.</text>
    <rect x="560" y="54" width="352" height="187" rx="11" fill="#0b142d" stroke="#354a7a"/>
    <path d="M560 88H912" stroke="#283d68"/>
    <circle cx="580" cy="71" r="3" fill="#5293ff"/>
    <circle cx="592" cy="71" r="3" fill="#6d80c2"/>
    <circle cx="604" cy="71" r="3" fill="#a0accb"/>
    <text x="760" y="75" fill="#839bc7" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="10">~/lighter00x</text>
    <g font-family="Consolas,DejaVu Sans Mono,monospace" font-size="14">
      <text x="584" y="120" fill="#70adff">$<tspan dx="8" fill="#ecf3ff">explore ideas</tspan></text>
      <text x="584" y="152" fill="#70adff">$<tspan dx="8" fill="#ecf3ff">build projects</tspan></text>
      <text x="584" y="184" fill="#70adff">$<tspan dx="8" fill="#ecf3ff">share progress</tspan></text>
